<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Padeja — Coaching</title>
<meta property="og:title" content="Join my coaching session on Padeja">
<meta property="og:description" content="Tap to see the club, time and price — then book your spot in the Padeja app.">
<style>
  :root{
    --bg:#0B1220; --card:#121C2E; --line:#1E2B44; --brand:#4FB7FF; --green:#39D98A;
    --orange:#F09537; --white:#EAF2FF; --sec:#8AA0BF;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--white);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .wrap{max-width:460px;margin:0 auto;padding:20px 16px 48px;}
  .logo{font-weight:800;font-size:18px;letter-spacing:.5px;color:var(--brand);text-align:center;margin-bottom:18px;}
  h1{font-size:22px;margin:0 0 4px;}
  .sub{color:var(--sec);font-size:14px;margin-bottom:4px;}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;margin-top:8px;}
  .pill.open{background:rgba(57,217,138,.16);color:var(--green);}
  .pill.full{background:rgba(138,160,191,.16);color:var(--sec);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:16px 0;}
  .row{display:flex;justify-content:space-between;align-items:center;margin:6px 0;}
  .k{color:var(--sec);font-size:13px;} .v{font-weight:700;font-size:15px;}
  .price{color:var(--green);}
  .cta{display:block;text-align:center;text-decoration:none;font-weight:700;border-radius:12px;padding:14px;margin-top:12px;}
  .cta.primary{background:var(--brand);color:#06101F;}
  .cta.ghost{background:var(--card);color:var(--white);border:1px solid var(--line);margin-top:10px;}
  .err{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--sec);}
  .spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--brand);
    border-radius:50%;animation:s 1s linear infinite;margin:40px auto;}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">PADEJA</div>
  <div id="app"><div class="spin"></div></div>
</div>
<script>
const SUPABASE_URL = 'https://odrckirnjavfptlfygbo.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9kcmNraXJuamF2ZnB0bGZ5Z2JvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1MzY3MzQsImV4cCI6MjA5NTExMjczNH0.rjoAQhEaTw6Sp-nGrQmYYvLdVKD7ewrKwG1PmMbyYgo';
const TZ = 'Europe/London';
const APPSTORE = 'https://apps.apple.com/gb/app/padeja/id6780805905';
const PLAYSTORE = 'https://play.google.com/store/apps/details?id=com.jackwoodford.padejafeedapp';
const UA = navigator.userAgent || '';
const IS_IOS = /iPad|iPhone|iPod/.test(UA) || (/Macintosh/.test(UA) && (navigator.maxTouchPoints||0) > 1);
const STORE = IS_IOS ? APPSTORE : PLAYSTORE;
const STORE_LABEL = IS_IOS ? 'Get the app on the App Store' : 'Get the app on Google Play';

function bookingId(){const u=new URLSearchParams(location.search);return u.get('b')||u.get('booking')||'';}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function money(c){ c=Number(c)||0; return c<=0 ? 'Free' : ('£'+(c/100).toFixed(2)); }
function whenText(a,b){
  try{
    const f=new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:TZ});
    const d=new Intl.DateTimeFormat('en-GB',{weekday:'short',day:'numeric',month:'short',timeZone:TZ});
    return d.format(new Date(a))+' · '+f.format(new Date(a))+'–'+f.format(new Date(b));
  }catch(e){return '';}
}

// Try to open the session in the Padeja app; if not installed, go to the store.
function openApp(){
  var id=bookingId();
  if(!id){ window.location.href=STORE; return false; }
  var t=Date.now();
  setTimeout(function(){ if(!document.hidden && Date.now()-t < 2000){ window.location.href=STORE; } }, 1100);
  window.location.href='padejafeed://coaching?b='+encodeURIComponent(id);
  return false;
}

async function load(){
  const id=bookingId();
  const app=document.getElementById('app');
  if(!id){app.innerHTML='<div class="err">No session specified.</div>';return;}
  try{
    const res=await fetch(SUPABASE_URL+'/rest/v1/rpc/activity_detail',{
      method:'POST',
      headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({p_booking_id:id})
    });
    if(!res.ok){throw new Error('unavailable');}
    const d=await res.json();
    if(!d||d.error){throw new Error('unavailable');}
    render(d);
  }catch(e){
    app.innerHTML='<div class="err">This coaching session is no longer available.<br><br>'
      +'<a class="cta primary" href="'+STORE+'">Get the Padeja app</a></div>';
  }
}

function render(d){
  const free=Number(d.spots_left)||0;
  const cap=Number(d.capacity)||0;
  const cancelled=(d.status&&d.status!=='active');
  const coach=(d.coach_name&&String(d.coach_name).trim())?('<div class="row"><span class="k">Coach</span><span class="v">'+esc(d.coach_name)+'</span></div>'):'';
  const joinable = !cancelled && free>0;
  document.getElementById('app').innerHTML=
    '<h1>'+esc(d.title||'Coaching')+'</h1>'
    +'<div class="sub">'+esc(d.club_name||d.court_name||'')+'</div>'
    +'<div class="sub">'+esc(whenText(d.start_at,d.end_at))+'</div>'
    +'<span class="pill '+(joinable?'open':'full')+'">'+(cancelled?'Cancelled':(free>0?(free+' spot'+(free===1?'':'s')+' left'):'Full'))+'</span>'
    +'<div class="card">'
      +'<div class="row"><span class="k">Price</span><span class="v price">'+money(d.price_cents)+'</span></div>'
      +(cap?'<div class="row"><span class="k">Spots</span><span class="v">'+(cap-free)+' / '+cap+' joined</span></div>':'')
      +coach
    +'</div>'
    +(joinable
        ? '<a class="cta primary" href="'+STORE+'" onclick="return openApp()">Book in the Padeja app</a>'
        : '<a class="cta primary" href="'+STORE+'" onclick="return openApp()">Open in the Padeja app</a>')
    +'<a class="cta ghost" href="'+STORE+'">'+STORE_LABEL+'</a>';
}
load();
</script>
</body>
</html>
